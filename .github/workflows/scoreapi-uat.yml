name: UAT Deploy
on:
  push:
    branches:
      - UAT

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UAT_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.UAT_PORT }} ${{ secrets.UAT_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on UAT server
        run: |
          ssh -p ${{ secrets.UAT_PORT }} \
            ${{ secrets.UAT_USER }}@${{ secrets.UAT_HOST }} << 'EOF'
              cd /home/amit8439941788/jenkins
              ./scoreapi.sh
          EOF
